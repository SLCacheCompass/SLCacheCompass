name: Deploy Cache Compass to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Check custom domain after deploy
        continue-on-error: true
        shell: bash
        run: |
          echo "=== DNS: slcachecompass.com A ==="
          dig +short slcachecompass.com A || true
          echo "=== DNS: slcachecompass.com AAAA ==="
          dig +short slcachecompass.com AAAA || true
          echo "=== DNS: www.slcachecompass.com CNAME ==="
          dig +short www.slcachecompass.com CNAME || true
          echo "=== ROOT HTTP ==="
          curl -sSIL --max-time 20 --retry 2 --retry-delay 2 http://slcachecompass.com/ || true
          echo "=== ROOT HTTPS ==="
          curl -sSIL --max-time 20 --retry 2 --retry-delay 2 https://slcachecompass.com/ || true
          echo "=== WWW HTTP ==="
          curl -sSIL --max-time 20 --retry 2 --retry-delay 2 http://www.slcachecompass.com/ || true
          echo "=== WWW HTTPS ==="
          curl -sSIL --max-time 20 --retry 2 --retry-delay 2 https://www.slcachecompass.com/ || true
