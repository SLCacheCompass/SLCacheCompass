<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" role="img" aria-labelledby="t d"><title id="t">Cache Compass 0.9.15 Cleanup screen</title><desc id="d">Desktop render based on the current Cache Compass 0.9.15 WinForms source, with illustrative sample values.</desc><rect width="1500" height="900" fill="#091013"/><rect x="28" y="24" width="1444" height="852" rx="18" fill="#111b1e" stroke="#304146" stroke-width="2"/><rect x="28" y="24" width="1444" height="145" rx="18" fill="#030303"/><text x="78" y="83" fill="#e8ebec" font-family="Georgia" font-size="42">CACHE COMPASS</text><text x="80" y="118" fill="#5cbbb0" font-family="Segoe UI,Arial" font-size="17">Inventory management for Second Life®</text><rect x="1120" y="63" width="270" height="52" rx="10" fill="#241b0c" stroke="#c4a261"/><text x="1255" y="96" fill="#c4a261" font-family="Segoe UI,Arial" font-size="16" text-anchor="middle" font-weight="700">FIRESTORM DETECTED ✓</text><g font-family="Segoe UI,Arial" font-size="14" font-weight="700"><rect x="58" y="180" width="190" height="58" rx="9" fill="#172328" stroke="#405358"/><text x="153" y="215" text-anchor="middle" fill="#e8ebec">WELCOME</text><rect x="258" y="180" width="250" height="58" rx="9" fill="#172328" stroke="#405358"/><text x="383" y="215" text-anchor="middle" fill="#e8ebec">PROTECTED FOLDERS</text><rect x="518" y="180" width="210" height="58" rx="9" fill="#172328" stroke="#405358"/><text x="623" y="215" text-anchor="middle" fill="#e8ebec">SEARCH ONLY</text><rect x="738" y="180" width="190" height="58" rx="9" fill="#3b3321" stroke="#c4a261" stroke-width="2"/><text x="833" y="215" text-anchor="middle" fill="#efd196">CLEANUP</text><rect x="938" y="180" width="190" height="58" rx="9" fill="#172328" stroke="#405358"/><text x="1033" y="215" text-anchor="middle" fill="#e8ebec">REVIEW</text></g><rect x="58" y="264" width="670" height="455" rx="12" fill="#0e171a" stroke="#304146"/><text x="84" y="306" fill="#c4a261" font-family="Segoe UI,Arial" font-size="18" font-weight="700">DUPLICATE CLEANUP</text><text x="84" y="334" fill="#9eaaae" font-family="Segoe UI,Arial" font-size="14">Choose the categories you want Cache Compass to inspect.</text><g font-family="Segoe UI,Arial" font-size="14" fill="#e8ebec"><g transform="translate(84 365)"><rect width="285" height="62" rx="8" fill="#111b1e" stroke="#405358"/><circle cx="28" cy="31" r="11" fill="#172328" stroke="#5cbbb0"/><text x="52" y="36">LANDMARKS</text></g><g transform="translate(390 365)"><rect width="285" height="62" rx="8" fill="#111b1e" stroke="#405358"/><circle cx="28" cy="31" r="11" fill="#172328" stroke="#5cbbb0"/><text x="52" y="36">NOTECARDS</text></g><g transform="translate(84 443)"><rect width="285" height="62" rx="8" fill="#111b1e" stroke="#405358"/><circle cx="28" cy="31" r="11" fill="#172328" stroke="#5cbbb0"/><text x="52" y="36">OBJECTS</text></g><g transform="translate(390 443)"><rect width="285" height="62" rx="8" fill="#111b1e" stroke="#405358"/><circle cx="28" cy="31" r="11" fill="#172328" stroke="#5cbbb0"/><text x="52" y="36">FOLDERS</text></g><g transform="translate(84 521)"><rect width="285" height="62" rx="8" fill="#111b1e" stroke="#405358"/><circle cx="28" cy="31" r="11" fill="#172328" stroke="#5cbbb0"/><text x="52" y="36">EMPTY FOLDERS</text></g><g transform="translate(390 521)"><rect width="285" height="62" rx="8" fill="#111b1e" stroke="#405358"/><circle cx="28" cy="31" r="11" fill="#172328" stroke="#5cbbb0"/><text x="52" y="36">CALLING CARDS</text></g><g transform="translate(84 599)"><rect width="180" height="62" rx="8" fill="#111b1e" stroke="#405358"/><circle cx="28" cy="31" r="11" fill="#172328" stroke="#5cbbb0"/><text x="52" y="36">SOUNDS</text></g><g transform="translate(276 599)"><rect width="190" height="62" rx="8" fill="#111b1e" stroke="#405358"/><circle cx="28" cy="31" r="11" fill="#172328" stroke="#5cbbb0"/><text x="52" y="36">ANIMATIONS</text></g><g transform="translate(478 599)"><rect width="197" height="62" rx="8" fill="#111b1e" stroke="#405358"/><circle cx="28" cy="31" r="11" fill="#172328" stroke="#5cbbb0"/><text x="52" y="36">GESTURES</text></g></g><rect x="750" y="264" width="692" height="455" rx="12" fill="#0e171a" stroke="#304146"/><text x="776" y="306" fill="#c4a261" font-family="Segoe UI,Arial" font-size="18" font-weight="700">KEYWORD CLEANUP</text><text x="776" y="334" fill="#9eaaae" font-family="Segoe UI,Arial" font-size="14">Build a review list from words you actually remember.</text><text x="776" y="377" fill="#5cbbb0" font-family="Segoe UI,Arial" font-size="13" font-weight="700">KEYWORD OR PHRASE</text><rect x="776" y="392" width="620" height="44" rx="6" fill="#091013" stroke="#405358"/><text x="794" y="421" fill="#7f8b8f" font-family="Segoe UI,Arial" font-size="14">e.g. Kupra</text><text x="776" y="474" fill="#5cbbb0" font-family="Segoe UI,Arial" font-size="13" font-weight="700">ITEM TYPES</text><g font-family="Segoe UI,Arial" font-size="13" fill="#e8ebec"><rect x="776" y="493" width="145" height="42" rx="6" fill="#172328" stroke="#405358"/><text x="848" y="520" text-anchor="middle">Objects</text><rect x="932" y="493" width="145" height="42" rx="6" fill="#172328" stroke="#405358"/><text x="1004" y="520" text-anchor="middle">Wearables</text><rect x="1088" y="493" width="145" height="42" rx="6" fill="#172328" stroke="#405358"/><text x="1160" y="520" text-anchor="middle">Body Parts</text><rect x="1244" y="493" width="145" height="42" rx="6" fill="#172328" stroke="#405358"/><text x="1316" y="520" text-anchor="middle">Landmarks</text><rect x="776" y="547" width="145" height="42" rx="6" fill="#172328" stroke="#405358"/><text x="848" y="574" text-anchor="middle">Notecards</text><rect x="932" y="547" width="145" height="42" rx="6" fill="#172328" stroke="#405358"/><text x="1004" y="574" text-anchor="middle">Textures</text><rect x="1088" y="547" width="145" height="42" rx="6" fill="#172328" stroke="#405358"/><text x="1160" y="574" text-anchor="middle">Scripts</text><rect x="1244" y="547" width="145" height="42" rx="6" fill="#172328" stroke="#405358"/><text x="1316" y="574" text-anchor="middle">Animations</text><rect x="776" y="601" width="145" height="42" rx="6" fill="#172328" stroke="#405358"/><text x="848" y="628" text-anchor="middle">Gestures</text><rect x="932" y="601" width="145" height="42" rx="6" fill="#172328" stroke="#405358"/><text x="1004" y="628" text-anchor="middle">Sounds</text><rect x="1088" y="601" width="145" height="42" rx="6" fill="#172328" stroke="#405358"/><text x="1160" y="628" text-anchor="middle">Calling Cards</text><rect x="1244" y="601" width="145" height="42" rx="6" fill="#172328" stroke="#405358"/><text x="1316" y="628" text-anchor="middle">Other</text></g><rect x="58" y="744" width="1384" height="76" rx="10" fill="#111b1e" stroke="#405358"/><text x="84" y="775" fill="#9eaaae" font-family="Segoe UI,Arial" font-size="13">Nothing is moved while Cache Compass builds the review list. Protected folders and protected inventory stay out.</text><rect x="1120" y="760" width="285" height="44" rx="7" fill="#c4a261"/><text x="1262" y="788" fill="#101617" font-family="Segoe UI,Arial" font-size="14" text-anchor="middle" font-weight="800">FIND ITEMS TO REVIEW</text><rect x="58" y="836" width="1384" height="22" fill="#0d171a"/><text x="80" y="853" fill="#9eaaae" font-family="Segoe UI,Arial" font-size="12">READY  ·  Firestorm: DETECTED  ·  Current avatar inventory bound.</text></svg>