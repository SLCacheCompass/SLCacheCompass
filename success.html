<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cache Compass Purchase Complete</title><link rel="icon" type="image/svg+xml" href="favicon.svg"><style>body{margin:0;background:#05090a;color:#d8dedb;font:16px/1.55 Arial,sans-serif}main{max-width:760px;margin:50px auto;padding:0 22px}.card{background:#0a1011;border:1px solid #5e4a27;border-radius:16px;padding:28px}h1{color:#f4efe4}.gold,a{color:#d5ad61}.button{display:inline-block;padding:12px 18px;border:1px solid #d5ad61;border-radius:8px;background:#17140e;color:#f4efe4;font-weight:700;text-decoration:none;cursor:pointer}.button:disabled{opacity:.45}code{display:block;padding:12px;background:#05090a;border:1px solid #425055;border-radius:8px;word-break:break-all}.message{color:#d5ad61}.license-box{margin:18px 0}.actions{display:flex;gap:10px;flex-wrap:wrap}.fine{color:#8f9995;font-size:13px}</style></head><body><main><div class="card"><p class="gold"><strong>CACHE COMPASS</strong></p><h1 id="title">Checking purchase…</h1><p class="message" id="msg"></p><div id="details"></div></div></main><script>const BASE='https://glamoujtjfczrpkrpbmp.supabase.co',STATUS=BASE+'/functions/v1/commerce-status',DOWNLOAD=BASE+'/functions/v1/customer-download',EMAIL=BASE+'/functions/v1/license-email',q=new URLSearchParams(location.search),order=q.get('order'),title=document.getElementById('title'),msg=document.getElementById('msg'),details=document.getElementById('details');function token(){const prefix='sb-glamoujtjfczrpkrpbmp-auth-token';for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i)||'';if(k===prefix||k.startsWith(prefix+'.')){try{const v=JSON.parse(localStorage.getItem(k)||'null');const t=v?.access_token||v?.currentSession?.access_token||v?.session?.access_token;if(t)return t}catch{}}}return null}const access=token();async function resend(btn,status){btn.disabled=true;status.textContent='Sending…';const r=await fetch(EMAIL,{method:'POST',headers:{authorization:'Bearer '+access,'content-type':'application/json'},body:JSON.stringify({action:'send',orderId:order})});const b=await r.json().catch(()=>({}));btn.disabled=false;if(r.ok)status.textContent='License email sent. Check your inbox and spam/junk folder.';else if(b.error==='please_wait_before_resending')status.textContent='Please wait about a minute before sending again.';else if(b.error==='email_provider_not_configured')status.textContent='Email delivery is temporarily unavailable. Your license number is shown above; you can still download now.';else status.textContent='Could not send the license email. Your license number is shown above; contact support if needed.'} (async()=>{if(!access){msg.textContent='Sign-in session not found. Return to checkout and sign in again.';return}if(!order){msg.textContent='Order reference missing.';return}for(let i=0;i<20;i++){const r=await fetch(STATUS,{method:'POST',headers:{authorization:'Bearer '+access,'content-type':'application/json'},body:JSON.stringify({orderId:order})});const b=await r.json().catch(()=>({}));if(!r.ok){msg.textContent='Could not confirm purchase: '+(b.error||r.status);return}if(b.fulfilled&&b.licenseKey){const dres=await fetch(DOWNLOAD,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({licenseKey:b.licenseKey})});const d=await dres.json().catch(()=>({}));title.textContent='Payment successful';msg.textContent='Payment confirmed and your Cache Compass license is ready.';details.innerHTML='<p><strong>Purchased:</strong> '+b.purchasedSlots+' avatar slots</p><p><strong>Current capacity:</strong> '+b.currentCapacity+' avatars</p><div class="license-box"><p><strong>Your license number</strong></p><code>'+b.licenseKey+'</code><p class="fine">Keep this number. We also try to email it to the verified purchase email automatically.</p></div><div class="actions">'+(dres.ok&&d.available?'<a class="button" href="'+d.url+'">Download Cache Compass</a>':'')+'<button class="button" id="resend" type="button">Email my license again</button></div><p id="email-status" class="message"></p><p class="fine"><a href="/license-recovery.html">License Recovery</a> is available later if you lose this page or email.</p>'+(dres.ok&&d.available?'<p><strong>Installer:</strong> '+d.version+'</p><p><strong>SHA-256:</strong></p><code>'+d.sha256+'</code>':'<p>Payment is complete, but the download is temporarily unavailable. Do not purchase again; contact support.</p>');const btn=document.getElementById('resend'),status=document.getElementById('email-status');btn.onclick=()=>resend(btn,status);return}msg.textContent='Waiting for payment fulfillment…';await new Promise(x=>setTimeout(x,1500))}msg.textContent='Fulfillment is taking longer than expected. Do not purchase again; contact support.'})()</script></body></html>
