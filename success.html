<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cache Compass Purchase Complete</title><style>body{margin:0;background:#05090a;color:#d8dedb;font:16px/1.55 Arial,sans-serif}main{max-width:760px;margin:50px auto;padding:0 22px}.card{background:#0a1011;border:1px solid #5e4a27;border-radius:16px;padding:28px}h1{color:#f4efe4}.gold,a{color:#d5ad61}.button{display:inline-block;padding:12px 18px;border:1px solid #d5ad61;border-radius:8px;background:#17140e;color:#f4efe4;font-weight:700;text-decoration:none}code{display:block;padding:12px;background:#05090a;border:1px solid #425055;border-radius:8px;word-break:break-all}.message{color:#d5ad61}</style></head><body><main><div class="card"><p class="gold"><strong>CACHE COMPASS</strong></p><h1 id="title">Checking purchase…</h1><p class="message" id="msg"></p><div id="details"></div></div></main><script>const BASE='https://glamoujtjfczrpkrpbmp.supabase.co',STATUS=BASE+'/functions/v1/commerce-status',DOWNLOAD=BASE+'/functions/v1/customer-download',q=new URLSearchParams(location.search),order=q.get('order'),title=document.getElementById('title'),msg=document.getElementById('msg'),details=document.getElementById('details');function token(){const prefix='sb-glamoujtjfczrpkrpbmp-auth-token';for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i)||'';if(k===prefix||k.startsWith(prefix+'.')){try{const v=JSON.parse(localStorage.getItem(k)||'null');const t=v?.access_token||v?.currentSession?.access_token||v?.session?.access_token;if(t)return t}catch{}}}return null}const access=token();(async()=>{if(!access){msg.textContent='Sign-in session not found. Return to checkout and sign in again.';return}if(!order){msg.textContent='Order reference missing.';return}for(let i=0;i<20;i++){const r=await fetch(STATUS,{method:'POST',headers:{authorization:'Bearer '+access,'content-type':'application/json'},body:JSON.stringify({orderId:order})});const b=await r.json().catch(()=>({}));if(!r.ok){msg.textContent='Could not confirm purchase: '+(b.error||r.status);return}if(b.fulfilled&&b.licenseKey){const dres=await fetch(DOWNLOAD,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({licenseKey:b.licenseKey})});const d=await dres.json().catch(()=>({}));if(!dres.ok||!d.available){msg.textContent='Payment is complete, but the download is temporarily unavailable. Contact support; do not purchase again.';return}title.textContent='Payment successful — download ready';msg.textContent='Payment confirmed and fulfillment completed.';details.innerHTML='<p><strong>Purchased:</strong> '+b.purchasedSlots+' avatar slots</p><p><strong>Current capacity:</strong> '+b.currentCapacity+' avatars</p><p>No license key entry is required. Cache Compass activates automatically.</p><p><strong>Installer:</strong> '+d.version+'</p><p><strong>SHA-256:</strong></p><code>'+d.sha256+'</code><p><a class="button" href="'+d.url+'">Download Cache Compass</a></p>';return}msg.textContent='Waiting for payment fulfillment…';await new Promise(x=>setTimeout(x,1500))}msg.textContent='Fulfillment is taking longer than expected. Do not purchase again; contact support.'})()</script></body></html>
